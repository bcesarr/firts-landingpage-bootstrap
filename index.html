<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
    />
    <link rel="stylesheet" href="src/styles/style.css" />
    <title>Firts Landingpage Bootstrap</title>
  </head>

  <body>
    <header
      class="d-flex justify-content-between align-items-center w-100 px-5 py-3 bg-dark"
    >

      <h1 class="text-white">Start Bootstrap</h1>

      <nav class="d-flex gap-5">
        <a class="text-white fs-6" href="#portifolio">PORTIFOLIO</a>
        <a class="text-white fs-6" href="#about">ABOUT</a>
        <a class="text-white fs-6" href="#contact">CONTACT</a>
      </nav>
    </header>

    <main class="hero d-flex flex-column justify-content-between align-items-center py-5 bg-info bg-opacity-75 gap-4">

      <img
        width="19%"
        src="src/assets/images/img/avatar.svg"
        alt="Avatar image of a person"
      />

      <h2 class="fs-1 text-white">Start Bootstrap</h2>

      <div class="divider d-flex align-items-center justify-content-center gap-3">

        <div class="divider-line"></div>

        <img width="10%" src="src/assets/images/icons/icon star.svg" alt="star icon" />

        <div class="divider-line"></div>

      </div>

      <h3 class="fs-4 text-white mt-2">Graphic Artist - Web Designer - Illustrator</h3>
    </main>

    <section id="portifolio" class="portifolio d-flex flex-column justify-content-between align-items-center py-5">

      <h2 class="fs-2">PORTIFOLIO</h2>

      <div class="divider d-flex align-items-center justify-content-center pt-2 gap-3">

        <div class="divider-line-two"></div>

        <img width="10%" src="src/assets/images/icons/icon star2.svg" alt="star icon" />

        <div class="divider-line-two"></div>

      </div>
    </section>

</html>
